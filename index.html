<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미적분Ⅰ 활동 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EC;--panel:#FFFFFF;--ink:#1F2B22;--muted:#5B6B5F;--line:#C9D6C8;--sign:#6A4527;--signText:#FFF8EE;--forest:#2E5E3E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#141A15;--panel:#1D251F;--ink:#E6EEE6;--muted:#9FB0A3;--line:#34443A;--sign:#7A5333;--signText:#FFF3E2;--forest:#9ED19A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.sign{background:var(--sign);color:var(--signText);border-radius:6px;padding:12px 18px 14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);margin-bottom:20px}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:32px;margin:0;line-height:1.2}
.sign p{margin:2px 0 0;font-size:14px;opacity:.9}
h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:22px;margin:20px 0 8px}
a.app{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;color:inherit;text-decoration:none}
a.app:hover,a.app:focus-visible{border-color:var(--forest);outline:none}
a.app b{font-size:18px}
a.app small{display:block;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;color:var(--forest);border:1px solid var(--forest);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sign">
    <h1>미적분Ⅰ 활동 모음</h1>
    <p>차시별 탐구 웹앱</p>
  </div>

  <h2>5. 함수의 증가와 감소, 극대와 극소</h2>
  <a class="app" href="baekunsanhike.html">
    <span class="tag">학습지 46~47쪽</span><b>⛰️ 백운산 산행 · 나는 그래프 위의 점</b>
    <small>등산로를 한 걸음씩 걸으며 증가·감소 구간과 극대·극소를 찾아봐요.</small>
  </a>
</div>
</body>
</html>
